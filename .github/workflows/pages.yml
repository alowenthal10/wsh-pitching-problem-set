# Builds real Stuff (tjStuff+), Location, and Pitching data from Statcast and deploys the site to GitHub Pages.
# Settings -> Pages -> Source must be "GitHub Actions".
name: Build data and deploy site

on:
  push:
    branches: [claude/job-application-problem-312r2h]
  schedule:
    - cron: "23 11 * 3-10 *"   # daily during the season, 11:23 UTC
  workflow_dispatch:
    inputs:
      season:
        description: Season to build
        default: "2026"
      validate:
        description: Recompute 2024 and compare with the published tjStuff+ leaderboard first
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TJSTUFF_SHA: 663ce503bdabf07f74e60ec05b9299695923103c
  TJSTUFF_RAW: https://raw.githubusercontent.com/tnestico/tjstuff_plus

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Download tjStuff+ model (pinned commit)
        run: |
          mkdir -p .tjstuff
          curl -fsSL "$TJSTUFF_RAW/$TJSTUFF_SHA/model/lgbm_model_2020_2023.joblib" -o .tjstuff/model.joblib
          curl -fsSL "$TJSTUFF_RAW/$TJSTUFF_SHA/tjstuff_plus_pitch_data_2024.csv" -o .tjstuff/reference_2024.csv

      - name: Restore Statcast cache
        uses: actions/cache@v4
        with:
          path: .statcast-cache
          key: statcast-${{ inputs.season || '2026' }}-${{ github.run_id }}
          restore-keys: statcast-${{ inputs.season || '2026' }}-

      - name: Validate against published 2024 tjStuff+
        if: ${{ inputs.validate }}
        run: python pipeline/build_stuff.py --validate --model .tjstuff/model.joblib --reference .tjstuff/reference_2024.csv

      - name: Build model data (current and previous season)
        run: |
          SEASON="${{ inputs.season || '2026' }}"
          for S in $((SEASON - 1)) $SEASON; do
            python pipeline/build_stuff.py --season "$S" --model .tjstuff/model.joblib \
              --model-source "$TJSTUFF_RAW/$TJSTUFF_SHA/model/lgbm_model_2020_2023.joblib" --out mockup/data
          done

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
